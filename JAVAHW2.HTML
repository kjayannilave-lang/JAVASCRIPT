<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Manager</title>
</head>
<body>

  <h2>Contact Manager</h2>

  <script>

    //Jashdijh
    const contact1 = {
      name: "John Doe",
      phone: "9876543210",
      email: "john@example.com",

      getInfo: function () {
        return `Name: ${this.name}, Phone: ${this.phone}, Email: ${this.email}`;
      }
    };

    // Second contact object
    const contact2 = {
      name: "Sarah Smith",
      phone: "9123456780",
      email: "sarah@example.com",

      getInfo: function () {
        return `Name: ${this.name}, Phone: ${this.phone}, Email: ${this.email}`;
      }
    };

    // Function to print contact information
    function printContactInfo(contact) {
      console.log(contact.getInfo());

      // Display on webpage
      document.write(contact.getInfo() + "<br><br>");
    }

    // Call function for both contacts
    printContactInfo(contact1);
    printContactInfo(contact2);

  </script>

</body>
</html>
