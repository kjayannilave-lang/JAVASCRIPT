<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         // Generate a random whole number between 1 and 100
let randomNumber = Math.floor(Math.random() * 100) + 1;

// Simulate a user score as a string
let userScore = "75";

// Convert the string to a number
let scoreNumber = Number(userScore);

// Show the difference
let difference = randomNumber - scoreNumber;

// Show the rounded square root
let roundedSqrt = Math.round(Math.sqrt(scoreNumber));

// Show π constant
let piValue = Math.PI;

// Convert "50" using implicit conversion and multiply by 2
let result = "50" * 2;

console.log("Random Number:", randomNumber);
console.log("User Score (String):", userScore);
console.log("Converted Score:", scoreNumber);
console.log("Difference:", difference);
console.log("Rounded Square Root:", roundedSqrt);
console.log("Pi Value:", piValue);
console.log('"50" * 2 =', result);
    

    </script>
    </body>
</html>
