<!DOCTYPE html>
<html>
<body>

<script>

for (let i = 1; i <= 5; i++) {

    let code = Number(prompt("Enter product code (1-3):"));
    let quantity = Number(prompt("Enter quantity:"));

    let productName;
    let price;
    let total;

    switch (code) {

        case 1:
            productName = "Apple";
            price = 30;
            break;

        case 2:
            productName = "Banana";
            price = 10;
            break;

        case 3:
            productName = "Mango";
            price = 50;
            break;

        default:
            console.log("Invalid product code");
            continue; // Skip this iteration
    }

    total = price * quantity;

    console.log("Product: " + productName);
    console.log("Quantity: " + quantity);
    console.log("Total Price: ₹" + total);

    if (total > 100) {
        console.log("High purchase");
    } else {
        console.log("Normal purchase");
    }

    console.log("------------------");
}

</script>

</body>
</html>
