<!DOCTYPE html>
<html>
<body>

<h2>Event Reminder Tool</h2>

<label>Select a past date:</label>
<input type="date" id="eventDate">
<button onclick="checkEvent()">Check</button>

<p id="result"></p>

<script>
function checkEvent() {
  let input = document.getElementById("eventDate").value;

  if (!input) {
    document.getElementById("result").innerHTML = "Please select a date.";
    return;
  }

  let pastDate = new Date(input);
  let today = new Date();

  // Month names
  let months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  // Extract date parts
  let day = pastDate.getDate();
  let month = months[pastDate.getMonth()];
  let year = pastDate.getFullYear();

  // Calculate full years passed
  let yearsPassed = today.getFullYear() - year;

  // Adjust if birthday/event hasn't occurred yet this year
  let hasOccurredThisYear =
    today.getMonth() > pastDate.getMonth() ||
    (today.getMonth() === pastDate.getMonth() && today.getDate() >= day);

  if (!hasOccurredThisYear) {
    yearsPassed--;
  }

  if (yearsPassed < 0) yearsPassed = 0;

  // Custom message
  let message = (yearsPassed >= 1)
    ? "It has been more than a year since that date."
    : "It has been less than a year since that date.";

  // Final output
  document.getElementById("result").innerHTML =
    `Date: ${day} ${month}, ${year} <br>
     Full years passed: ${yearsPassed} <br>
     ${message}`;
}
</script>

</body>
</html>
