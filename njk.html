
<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>


<script>

var hjk = [1,2,3,4];
var yui = hjk.filter(myfunction);
function myfunction (value,index,array) {
  return value>2 
};
document.getElementById("demo").innerHTML=yui;






</script>
<p id="ginger"></p>

<script>
  var method = [1,2,3,4,5];
var target = method.reduce(myfunction);
function myfunction (total,value,index,array){
  return value+total;
}
document.getElementById("ginger").innerHTML=target;




</script>
  <p id="dakini"></p>
<script>

var thangu = [1,2,3,4,5];
var mangu = thangu.every(myfunction);
function myfunction (value,index,array){
  return value >2 ;
}
document.getElementById("dakini").innerHTML=mangu;

</script>
