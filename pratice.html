<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>library</title>
</head>
<body>
    <script>
        //creating the book object
        let book= {
            title : "The alchimist",
            author :"paulo coehlo",
            year  : "1988",
            //method to return book summery
            getsummery:function() {
                return "The book" + this .title + "was written by" + this.author;
            }
        };
        // function to dsplay the summery   
        function printbook (book) {
            console.log (book.getsummery()) ;
        }
        //calling the function
        printbook(book);

    </script>
    
</body>
</html>
